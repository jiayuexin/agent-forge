name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only run publish dry-run (no npm publish)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Pack dry-run (all packages)
        if: ${{ inputs.dry_run }}
        run: pnpm publish:pack

      - name: Publish dry-run (names not taken on npmjs)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter './packages/*' --filter '!@agentforge/core' --filter '!@agentforge/cli' publish --dry-run --no-git-checks --access public --registry https://registry.npmjs.org

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm -r --filter './packages/*' publish --no-git-checks --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
