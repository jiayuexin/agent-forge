services:
  hub:
    build: .
    ports:
      - '8080:8080'
    environment:
      AGENTFORGE_ADMIN_TOKEN: ${AGENTFORGE_ADMIN_TOKEN:?Set AGENTFORGE_ADMIN_TOKEN}
      AGENTFORGE_DATA_DIR: /data
      AGENTFORGE_HOST: 0.0.0.0
      AGENTFORGE_PORT: '8080'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - hub-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  hub-data:
